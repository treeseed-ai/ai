services:
  migrations:
    depends_on:
      postgres: { condition: service_healthy }
  api:
    ports: !reset []
    depends_on: !override
      migrations: { condition: service_completed_successfully }
    networks:
      default: {}
      ai-shared: { aliases: [training-api] }
    volumes: ["/var/lib/treeseed-ai/platform:/factory:ro", "/run/treeseed-ai/training:/runtime-status:ro"]
    environment: { AI_FACTORY_MODE_FILE: /factory/mode.json, AI_FACTORY_STATUS_FILE: /runtime-status/status.json, SIGNING_PUBLIC_KEY_FILE: /run/secrets/training-signing-public, SIGNING_KEY_ID: "${SIGNING_KEY_ID:?SIGNING_KEY_ID is required}" }
    secrets: [training-signing-public]
  manager:
    group_add: ["${RUNTIME_GID:?RUNTIME_GID is required}"]
    depends_on: !override
      migrations: { condition: service_completed_successfully }
      artifact: { condition: service_healthy }
    volumes: ["/var/lib/treeseed-ai/platform:/factory:ro", "/run/treeseed-ai/training:/runtime-status"]
    environment: { AI_FACTORY_MODE_FILE: /factory/mode.json, AI_FACTORY_STATUS_FILE: /runtime-status/status.json }
  marker:
    restart: "no"
  axolotl:
    restart: "no"
  artifact:
    group_add: ["${RUNTIME_GID:?RUNTIME_GID is required}"]
  minio:
    networks:
      default: { aliases: [training-minio] }
      ai-shared: { aliases: [training-minio] }
networks:
  ai-shared: { external: true, name: ai-shared }
secrets:
  training-signing-public: { file: /etc/treeseed-ai/manager/factory/artifact-signing-public.pem }
