name: treeseed-ai
x-product-environment: &product-environment
  env_file: /etc/treeseed/components/ai/environment
x-security: &security
  security_opt: ["no-new-privileges:true"]
services:
  inference-gpu-state-init:
    image: "@INFERENCE_API_IMAGE@"
    <<: *security
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c", "install -d -o 1000 -g 1000 -m 0770 /run/treeseed-ai"]
    volumes: [gpu-admission:/run/treeseed-ai]
    networks: [inference-private]
  inference-postgres:
    image: "@POSTGRES_IMAGE@"
    <<: *security
    restart: unless-stopped
    environment:
      POSTGRES_DB: inference
      POSTGRES_USER: inference
      POSTGRES_PASSWORD: "${INFERENCE_POSTGRES_PASSWORD:?INFERENCE_POSTGRES_PASSWORD is required}"
    volumes:
      - type: bind
        source: ${TREESEED_COMPONENT_DATA_ROOT:-/var/lib/treeseed/components}/ai/data/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inference -d inference"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [inference-private]
  inference-migrations:
    image: "@INFERENCE_MIGRATIONS_IMAGE@"
    <<: [*product-environment, *security]
    environment:
      DATABASE_URL: "${INFERENCE_DATABASE_URL:?INFERENCE_DATABASE_URL is required}"
    depends_on:
      inference-postgres: { condition: service_healthy }
    restart: "no"
    networks: [inference-private]
  inference-vllm:
    image: "@INFERENCE_VLLM_IMAGE@"
    <<: [*product-environment, *security]
    restart: unless-stopped
    ipc: host
    volumes:
      - type: bind
        source: ${TREESEED_COMPONENT_DATA_ROOT:-/var/lib/treeseed/components}/ai/data/models
        target: /models
      - type: bind
        source: ${TREESEED_COMPONENT_DATA_ROOT:-/var/lib/treeseed/components}/ai/data/inference
        target: /state
        read_only: true
    environment:
      HF_HOME: /models
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: "True"
      TREESEED_VLLM_MODEL: "${PUBLIC_MODEL:-local-model}"
    command: ["--model", "${SOURCE_MODEL:-Qwen/Qwen3.5-4B}", "--revision", "${SOURCE_MODEL_REVISION:-851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a}", "--served-model-name", "${PUBLIC_MODEL:-local-model}", "--max-model-len", "${MAX_MODEL_LENGTH:-16384}", "--enable-lora", "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder", "--reasoning-parser", "qwen3"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    networks: [inference-private]
  inference-evaluator:
    image: "@INFERENCE_EVALUATOR_IMAGE@"
    <<: [*product-environment, *security]
    restart: unless-stopped
    environment:
      VLLM_URL: http://inference-vllm:8000
    volumes:
      - type: bind
        source: ${TREESEED_COMPONENT_DATA_ROOT:-/var/lib/treeseed/components}/ai/data/inference
        target: /state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [inference-private]
  inference-manager:
    image: "@INFERENCE_MANAGER_IMAGE@"
    <<: [*product-environment, *security]
    restart: unless-stopped
    depends_on:
      inference-migrations: { condition: service_completed_successfully }
      inference-evaluator: { condition: service_healthy }
    environment:
      DATABASE_URL: "${INFERENCE_DATABASE_URL:?INFERENCE_DATABASE_URL is required}"
      EVALUATOR_URL: http://inference-evaluator:8080
      TREESEED_GPU_ADMISSION_FILE: /run/treeseed-ai/gate.json
      TREESEED_GPU_DEFAULT_ADMISSION: closed
    volumes: [gpu-admission:/run/treeseed-ai]
    networks: [inference-private]
  inference-api:
    image: "@INFERENCE_API_IMAGE@"
    <<: [*product-environment, *security]
    restart: unless-stopped
    depends_on:
      inference-migrations: { condition: service_completed_successfully }
      inference-gpu-state-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: "${INFERENCE_DATABASE_URL:?INFERENCE_DATABASE_URL is required}"
      CONTROL_HOST: 0.0.0.0
      INFERENCE_HOST: 0.0.0.0
      VLLM_URL: http://inference-vllm:8000
      TREESEED_GPU_ADMISSION_FILE: /run/treeseed-ai/gate.json
      TREESEED_GPU_ACTIVITY_FILE: /run/treeseed-ai/status.json
      TREESEED_GPU_DEFAULT_ADMISSION: closed
    volumes: [gpu-admission:/run/treeseed-ai]
    expose: ["4770", "4771"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4770/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 180s
    networks: [inference-private, platform, treeseed-edge]
  training-gpu-state-init:
    image: "@TRAINING_API_IMAGE@"
    <<: *security
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c", "install -d -o 10001 -g 10001 -m 0770 /run/treeseed-ai"]
    volumes: [gpu-admission:/run/treeseed-ai]
    networks: [training-private]
  training-migrations:
    image: "@TRAINING_MIGRATIONS_IMAGE@"
    <<: [*product-environment, *security]
    environment:
      DATABASE_URL: "${TRAINING_DATABASE_URL:?TRAINING_DATABASE_URL is required}"
    depends_on:
      training-postgres: { condition: service_healthy }
    restart: "no"
    networks: [training-private]
  training-postgres:
    image: "@POSTGRES_IMAGE@"
    <<: *security
    restart: unless-stopped
    environment:
      POSTGRES_DB: training
      POSTGRES_USER: training
      POSTGRES_PASSWORD: "${TRAINING_POSTGRES_PASSWORD:?TRAINING_POSTGRES_PASSWORD is required}"
    volumes:
      - type: bind
        source: ${TREESEED_COMPONENT_DATA_ROOT:-/var/lib/treeseed/components}/ai/data/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d training"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [training-private]
  training-marker:
    image: "@MARKER_WORKER_IMAGE@"
    <<: [*product-environment, *security]
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${TREESEED_COMPONENT_DATA_ROOT:-/var/lib/treeseed/components}/ai/data/training
        target: /artifacts
      - type: bind
        source: ${TREESEED_COMPONENT_DATA_ROOT:-/var/lib/treeseed/components}/ai/data/models
        target: /models
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    healthcheck: &worker-health
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [training-private]
  training-axolotl:
    image: "@AXOLOTL_WORKER_IMAGE@"
    <<: [*product-environment, *security]
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${TREESEED_COMPONENT_DATA_ROOT:-/var/lib/treeseed/components}/ai/data/training
        target: /artifacts
      - type: bind
        source: ${TREESEED_COMPONENT_DATA_ROOT:-/var/lib/treeseed/components}/ai/data/models
        target: /models
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    healthcheck: *worker-health
    networks: [training-private]
  training-artifact:
    image: "@ARTIFACT_WORKER_IMAGE@"
    <<: [*product-environment, *security]
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${TREESEED_COMPONENT_DATA_ROOT:-/var/lib/treeseed/components}/ai/data/training
        target: /artifacts
      - type: bind
        source: ${TREESEED_COMPONENT_DATA_ROOT:-/var/lib/treeseed/components}/ai/data/archive
        target: /archive
    secrets: [artifact-signing-key]
    environment:
      SIGNING_KEY: /run/secrets/artifact-signing-key
    healthcheck: *worker-health
    networks: [training-private]
  training-manager:
    image: "@TRAINING_MANAGER_IMAGE@"
    <<: [*product-environment, *security]
    restart: unless-stopped
    depends_on:
      training-migrations: { condition: service_completed_successfully }
      training-gpu-state-init: { condition: service_completed_successfully }
      training-artifact: { condition: service_healthy }
    group_add: ["10001"]
    environment:
      DATABASE_URL: "${TRAINING_DATABASE_URL:?TRAINING_DATABASE_URL is required}"
      MARKER_URL: http://training-marker:8080
      AXOLOTL_URL: http://training-axolotl:8080
      ARTIFACT_URL: http://training-artifact:8080
      TREESEED_GPU_ADMISSION_FILE: /run/treeseed-ai/gate.json
      TREESEED_GPU_ACTIVITY_FILE: /run/treeseed-ai/status.json
      TREESEED_GPU_DEFAULT_ADMISSION: closed
    volumes: [gpu-admission:/run/treeseed-ai]
    networks: [training-private]
  training-api:
    image: "@TRAINING_API_IMAGE@"
    <<: [*product-environment, *security]
    restart: unless-stopped
    depends_on:
      training-migrations: { condition: service_completed_successfully }
      training-gpu-state-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: "${TRAINING_DATABASE_URL:?TRAINING_DATABASE_URL is required}"
      CONTROL_HOST: 0.0.0.0
      TREESEED_GPU_ADMISSION_FILE: /run/treeseed-ai/gate.json
      TREESEED_GPU_ACTIVITY_FILE: /run/treeseed-ai/status.json
      TREESEED_GPU_DEFAULT_ADMISSION: closed
    volumes: [gpu-admission:/run/treeseed-ai]
    expose: ["4780"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4780/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [training-private, platform, treeseed-edge]
secrets:
  artifact-signing-key:
    file: /etc/treeseed/credentials/ai-artifact-signing-key
volumes:
  gpu-admission: {}
networks:
  inference-private: { internal: true }
  training-private: { internal: true }
  platform:
    name: treeseed-platform
    external: true
  treeseed-edge:
    name: treeseed-edge
    external: true
