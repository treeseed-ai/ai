name: treeseed-ai-factory-gateway
services:
  gateway:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: "no"
    ports: ["0.0.0.0:4770:4770", "0.0.0.0:4771:4771", "0.0.0.0:4780:4780"]
    volumes:
      - /usr/lib/treeseed-ai/manager/factory/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/treeseed-ai/manager/tls:/tls:ro
    networks: [ai-shared]
networks:
  ai-shared: { external: true, name: ai-shared }
