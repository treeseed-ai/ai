schemaVersion: treeseed.package/v1
id: "@treeseed/ai"
name: TreeSeed AI
kind: node-typescript
type: runtime-appliance
repository: treeseed-ai/ai
capabilities: { save: true, verify: true, publish: false, deploy: false, localOnly: false }
workflowTemplateVersion: "1"
verify:
  fast: npm run verify
  local: npm run verify:local
  release: npm run verify
releaseGate:
  workflow: verify.yml
projectArchitecture:
  topology: single_repository_site
  rootPath: .
  sitePath: docs
  contentPath: docs/src/content
  contentRuntimeSource: none
  localContentMaterialization: none
