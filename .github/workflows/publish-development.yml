name: Publish protected TreeAI component release candidate

on:
  workflow_dispatch:
    inputs:
      rc: { description: "Positive release-candidate number", required: true, type: string }
      component_revision: { description: "Positive Compose/Debian component revision", required: false, default: "1", type: string }

permissions: { contents: read }

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 360
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Validate protected development identity
        run: |
          test '${{ github.ref }}' = 'refs/heads/staging'
          printf '%s' '${{ inputs.rc }}' | grep -Eq '^[1-9][0-9]*$'
          printf '%s' '${{ inputs.component_revision }}' | grep -Eq '^[1-9][0-9]*$'
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          version=$(node -p "require('./release/manifest.json').version")
          echo "TREEAI_RC_TAG=${version}-rc${{ inputs.rc }}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm verify
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@v3.9.2
      - name: Create exact source and image plan
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p assets prior plan
          git archive --format=tar --prefix=treeai-source/ HEAD | gzip -n > assets/treeai-source.tar.gz
          previous=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease --jq '.[]|select(.isDraft==false and .isPrerelease==false)|.tagName' | head -1)
          test -n "$previous"
          gh release download "$previous" --pattern image-manifest.json --dir prior
          TREEAI_RELEASE_VERSION="$TREEAI_RC_TAG" TREEAI_DEVELOPMENT_BASE="$previous" node --import tsx scripts/release/plan-image-builds.ts plan/image-plan.json prior/image-manifest.json
          cp prior/image-manifest.json assets/image-manifest.json
          cp plan/image-plan.json assets/development-image-plan.json
      - name: Publish every exact RC image and verify Docker Hub read-back
        run: |
          while IFS= read -r role; do
            action=$(jq -r --arg role "$role" '.images[$role].action' plan/image-plan.json)
            repository=$(jq -r --arg role "$role" '.images[$role].repository' plan/image-plan.json)
            build_identity=$(jq -r --arg role "$role" '.images[$role].buildIdentity' plan/image-plan.json)
            if test "$action" = built; then
              dockerfile=$(jq -r --arg role "$role" '.images[$role].dockerfile' plan/image-plan.json)
              build_args=$(jq -r --arg role "$role" '.images[$role].buildArgs' plan/image-plan.json)
              arguments=()
              if test -n "$build_args"; then arguments+=(--build-arg "$build_args"); fi
              docker buildx build . --file "$dockerfile" --platform linux/amd64 --push --provenance mode=max --sbom=true --tag "$repository:$TREEAI_RC_TAG" "${arguments[@]}"
            else
              digest=$(jq -r --arg role "$role" '.images[$role].digest' plan/image-plan.json)
              docker buildx imagetools create --tag "$repository:$TREEAI_RC_TAG" "$repository@$digest"
            fi
            digest=$(docker buildx imagetools inspect "$repository:$TREEAI_RC_TAG" | awk '/^Digest:/{print $2;exit}')
            printf '%s' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
            cosign sign --yes "$repository@$digest"
            readback=$(docker buildx imagetools inspect "$repository:$TREEAI_RC_TAG" | awk '/^Digest:/{print $2;exit}')
            test "$readback" = "$digest"
            jq --arg role "$role" --arg digest "$digest" --arg tag "$TREEAI_RC_TAG" --arg identity "$build_identity" '.version=$tag | .images[$role].digest=$digest | .images[$role].tag=$tag | .images[$role].buildIdentity=$identity | .images[$role].disposition="built"' assets/image-manifest.json > assets/image-manifest.json.new
            mv assets/image-manifest.json.new assets/image-manifest.json
          done < <(jq -r '.images | keys[]' plan/image-plan.json)
      - name: Create exact managed component bundle
        env:
          TREEAI_COMPONENT_RELEASE: "${{ env.TREEAI_RC_TAG }}"
          TREEAI_COMPONENT_REVISION: "${{ inputs.component_revision }}"
          TREEAI_SOURCE_COMMIT: "${{ github.sha }}"
          TREEAI_IMAGE_MANIFEST: "${{ github.workspace }}/assets/image-manifest.json"
        run: |
          pnpm build:component-release
          cp release-assets/component/* assets/
      - uses: actions/attest-build-provenance@v3
        with: { subject-path: "release-assets/component/*" }
      - name: Publish immutable prerelease
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          (cd assets && find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS)
          mapfile -t files < <(find assets -type f -print | sort)
          gh release create "$TREEAI_RC_TAG" "${files[@]}" --target '${{ github.sha }}' --prerelease --title "TreeAI $TREEAI_RC_TAG" --notes "Managed TreeSeed component release; host installation is owned by treeseed-ai/deployment."
