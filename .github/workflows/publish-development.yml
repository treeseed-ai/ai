name: Publish protected TreeAI release candidate

on:
  workflow_dispatch:
    inputs:
      rc: { description: "Positive release-candidate number, e.g. 1", required: true, type: string }
      generation: { description: Monotonic numeric catalog generation, required: true, type: string }
      package_only_bridge: { description: "Publish a one-time package-only manager capability bridge", required: false, default: false, type: boolean }

permissions: { contents: read }

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 240
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Validate protected development identity
        run: |
          test '${{ github.ref }}' = 'refs/heads/staging'
          printf '%s' '${{ inputs.rc }}' | grep -Eq '^[1-9][0-9]*$'
          printf '%s' '${{ inputs.generation }}' | grep -Eq '^[1-9][0-9]+$'
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          version=$(node -p "require('./release/manifest.json').version")
          echo "TREEAI_RC_DEBIAN_VERSION=${version}~rc${{ inputs.rc }}-1" >> "$GITHUB_ENV"
          echo "TREEAI_RC_TAG=${version}-rc${{ inputs.rc }}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm verify
      - uses: sigstore/cosign-installer@v3.9.2
      - name: Create immutable development source bundle
        run: |
          mkdir -p assets
          git archive --format=tar --prefix=treeai-source/ HEAD | gzip -n > assets/treeai-source.tar.gz
          digest=$(sha256sum assets/treeai-source.tar.gz | awk '{print $1}')
          echo "TREEAI_SOURCE_ARCHIVE_SHA256=$digest" >> "$GITHUB_ENV"
          echo "TREEAI_SOURCE_ARCHIVE_URL=https://github.com/treeseed-ai/ai/releases/download/$TREEAI_RC_TAG/treeai-source.tar.gz" >> "$GITHUB_ENV"
      - name: Resolve production image identities and local build requirements
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p prior plan assets
          previous=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease --jq '.[]|select(.isDraft==false and .isPrerelease==false)|.tagName' | head -1)
          test -n "$previous"
          gh release download "$previous" --dir prior
          catalog_deb=$(find prior -maxdepth 1 -type f -name 'treeseed-ai-release-catalog_*.deb' -print -quit)
          test -n "$catalog_deb"
          mkdir -p prior-catalog
          dpkg-deb --extract "$catalog_deb" prior-catalog
          cp prior-catalog/usr/share/treeseed-ai/release/catalog.json assets/prior-catalog.json
          gpg --batch --import release/apt/treeseed-ai-archive-keyring.asc
          gpg --batch --verify prior/SHA256SUMS.asc prior/SHA256SUMS
          (cd prior && sha256sum -c SHA256SUMS)
          for role in $(jq -r '.images|keys[]' prior/image-manifest.json); do
            repository=$(jq -r --arg role "$role" '.images[$role].repository' prior/image-manifest.json)
            digest=$(jq -r --arg role "$role" '.images[$role].digest' prior/image-manifest.json)
            cosign verify --certificate-identity 'https://github.com/treeseed-ai/ai/.github/workflows/release.yml@refs/heads/main' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' "$repository@$digest" >/dev/null
          done
          TREEAI_RELEASE_VERSION="$TREEAI_RC_TAG" TREEAI_DEVELOPMENT_BASE="$previous" node --import tsx scripts/release/plan-image-builds.ts plan/image-plan.json prior/image-manifest.json
          cp prior/image-manifest.json assets/image-manifest.json
          cp plan/image-plan.json assets/development-image-plan.json
          jq '{status:"ready",policy:(if ([.images[].action]|any(.=="built")) then "local-images-required" else "package-only" end),requiredLocalRoles:[.images|to_entries[]|select(.value.action=="built")|.key],publishedDevelopmentImages:0}' plan/image-plan.json
      - name: Build development Debian generation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper lintian nodejs
          sed -i "1s/([^)]*)/($TREEAI_RC_DEBIAN_VERSION)/; 1s/) stable;/) development;/" debian/changelog
          TREEAI_DEBIAN_VERSION="$TREEAI_RC_DEBIAN_VERSION" TREEAI_RELEASE_VERSION="$TREEAI_RC_TAG" TREEAI_RELEASE_CHANNEL=development TREEAI_RELEASE_GENERATION='${{ inputs.generation }}' TREEAI_IMAGE_MANIFEST="$PWD/assets/image-manifest.json" TREEAI_IMAGE_PLAN="$PWD/assets/development-image-plan.json" TREEAI_SOURCE_REVISION='${{ github.sha }}' TREEAI_SOURCE_ARCHIVE_URL="$TREEAI_SOURCE_ARCHIVE_URL" TREEAI_SOURCE_ARCHIVE_SHA256="$TREEAI_SOURCE_ARCHIVE_SHA256" TREEAI_FORCE_PACKAGE_ONLY='${{ inputs.package_only_bridge && '1' || '0' }}' TREEAI_CATALOG_PACKAGE_SET='${{ inputs.package_only_bridge && 'management' || 'all' }}' TREEAI_BASE_CATALOG='${{ inputs.package_only_bridge && format('{0}/assets/prior-catalog.json', github.workspace) || '' }}' dpkg-buildpackage -b -us -uc
          find .. -maxdepth 1 -type f -name 'treeseed-ai*.deb' -exec cp {} assets/ \;
          lintian --fail-on error assets/*.deb
      - name: Sign and publish immutable prerelease
        env:
          GH_TOKEN: "${{ github.token }}"
          APT_GPG_PRIVATE_KEY: "${{ secrets.APT_GPG_PRIVATE_KEY }}"
          APT_GPG_PASSPHRASE: "${{ secrets.APT_GPG_PASSPHRASE }}"
        run: |
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          export APT_RELEASE_FINGERPRINT="$(cat release/apt-development/RELEASE_KEY_FINGERPRINT)"
          (cd assets && find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS)
          gpg --batch --yes --pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE" --local-user "$APT_RELEASE_FINGERPRINT" --detach-sign --armor assets/SHA256SUMS
          mapfile -t files < <(find assets -type f -print | sort)
          if gh release view "$TREEAI_RC_TAG" >/dev/null 2>&1; then gh release upload "$TREEAI_RC_TAG" --clobber "${files[@]}"; else gh release create "$TREEAI_RC_TAG" "${files[@]}" --target '${{ github.sha }}' --prerelease --title "TreeAI $TREEAI_RC_TAG" --notes "Protected release candidate; catalog generation ${{ inputs.generation }}."; fi
      - name: Build signed development APT suite
        env:
          GH_TOKEN: "${{ github.token }}"
          APT_GPG_PRIVATE_KEY: "${{ secrets.APT_GPG_PRIVATE_KEY }}"
          APT_GPG_PASSPHRASE: "${{ secrets.APT_GPG_PASSPHRASE }}"
        run: |
          mkdir -p all-development-debs development-debs pages/apt
          gh release download "$TREEAI_RC_TAG" --pattern '*.deb' --dir all-development-debs
          if test '${{ inputs.package_only_bridge }}' = true; then
            for package in archive-keyring development-archive-keyring host-js-runtime manager release-catalog cli; do
              cp all-development-debs/treeseed-ai-$package\_*.deb development-debs/
            done
          else
            cp all-development-debs/*.deb development-debs/
          fi
          sh scripts/release/mirror-apt-suite.sh https://treeseed-ai.github.io/ai/apt stable pages/apt || true
          export APT_RELEASE_FINGERPRINT="$(cat release/apt-development/RELEASE_KEY_FINGERPRINT)"
          sh scripts/release/build-apt-repository.sh development-debs pages/apt "$TREEAI_RC_DEBIAN_VERSION" development
      - uses: actions/upload-artifact@v4
        with: { name: development-apt-pages-site, path: pages, if-no-files-found: error }

  pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: development-apt-pages-site, path: pages }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages }
      - id: deploy
        uses: actions/deploy-pages@v4
