name: Register one-time TreeAI legacy manager bridge

on:
  workflow_dispatch:
    inputs:
      rc: { description: "One-time 0.10 release-candidate number", required: true, type: string }
      generation: { description: "One-time legacy catalog generation", required: true, type: string }

permissions: { contents: read }

jobs:
  refuse-main:
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected staging implementation
        run: |
          echo "This default-branch file only registers the workflow path. Dispatch it with --ref staging."
          exit 1
