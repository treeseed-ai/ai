name: Repair TreeSeed AI release checksums

on:
  workflow_dispatch:
    inputs:
      version: { description: Exact existing release version, required: true, type: string }

permissions: { contents: read }

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate immutable release inputs
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          test '${{ github.ref }}' = 'refs/heads/main'
          test '${{ inputs.version }}' = "$(node -p "require('./release/manifest.json').version")"
          gh release view "${{ inputs.version }}" --json isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false)' >/dev/null
          git merge-base --is-ancestor "${{ inputs.version }}" HEAD
          unexpected=$(git diff --name-only "${{ inputs.version }}" HEAD | grep -Ev '^(\.github/workflows/(release|repair-release|repair-release-checksums|repair-apt)\.yml|scripts/release/(validate-image-metadata|stage-release-assets)\.ts|tests/cli/(cli|release-assets)\.test\.ts)$' || true)
          test -z "$unexpected" || { printf 'Release-affecting changes since tag:\n%s\n' "$unexpected" >&2; exit 1; }
          mkdir assets
          gh release download "${{ inputs.version }}" --dir assets
          gpg --batch --import release/apt/treeseed-ai-archive-keyring.asc
          gpg --batch --verify assets/SHA256SUMS.asc assets/SHA256SUMS
          sed -E 's#  .*/#  #' assets/SHA256SUMS > assets/previous-flat-SHA256SUMS
          (cd assets && sha256sum -c previous-flat-SHA256SUMS)
          rm assets/previous-flat-SHA256SUMS
          node --import tsx scripts/release/stage-release-assets.ts assets published-assets
      - name: Replace signed checksum pair
        env:
          GH_TOKEN: "${{ github.token }}"
          APT_GPG_PRIVATE_KEY: "${{ secrets.APT_GPG_PRIVATE_KEY }}"
          APT_GPG_PASSPHRASE: "${{ secrets.APT_GPG_PASSPHRASE }}"
        run: |
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          export APT_RELEASE_FINGERPRINT="$(cat release/apt/RELEASE_KEY_FINGERPRINT)"
          cd published-assets
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS
          gpg --batch --yes --pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE" --local-user "$APT_RELEASE_FINGERPRINT" --detach-sign --armor SHA256SUMS
          cd ..
          gh release upload "${{ inputs.version }}" published-assets/SHA256SUMS published-assets/SHA256SUMS.asc --clobber
          rm -rf verified-assets
          mkdir verified-assets
          gh release download "${{ inputs.version }}" --dir verified-assets
          (cd verified-assets && sha256sum -c SHA256SUMS)
          gpg --batch --verify verified-assets/SHA256SUMS.asc verified-assets/SHA256SUMS
