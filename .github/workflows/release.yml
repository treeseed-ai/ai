name: Publish coordinated TreeSeed AI release

on:
  workflow_dispatch:
    inputs:
      version: { description: Exact release version, required: true, type: string }

permissions: { contents: read }

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs: { sha: "${{ steps.commit.outputs.sha }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate release identity
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          test '${{ github.ref }}' = 'refs/heads/main'
          test '${{ inputs.version }}' = "$(node -p "require('./release/manifest.json').version")"
          node --import tsx scripts/release/validate.ts --release
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          ! gh release view "v${{ inputs.version }}" >/dev/null 2>&1
      - run: pnpm verify
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  authorize:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo 'Protected release approval granted.'

  resolve-images:
    needs: [validate, authorize]
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read }
    outputs: { matrix: "${{ steps.plan.outputs.matrix }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@v3.9.2
      - id: plan
        name: Resolve verified prior image digests
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p previous-download previous-assets/sboms previous-assets/vulnerabilities release-plan
          previous=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease --jq '.[]|select(.isDraft==false and .isPrerelease==false)|.tagName' | grep -vFx "v${{ inputs.version }}" | head -1 || true)
          if test -n "$previous"; then
            gh release download "$previous" --dir previous-download
            gpg --batch --import release/apt/treeseed-ai-archive-keyring.asc
            gpg --batch --verify previous-download/SHA256SUMS.asc previous-download/SHA256SUMS
            (cd previous-download && sha256sum -c SHA256SUMS)
            cp previous-download/image-manifest.json previous-assets/image-manifest.json
          fi
          node --import tsx scripts/release/plan-image-builds.ts release-plan/image-plan.json previous-assets/image-manifest.json
          jq -c '{include:[.images[]]}' release-plan/image-plan.json | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"
          for role in $(jq -r '.images[]|select(.action=="reused")|.role' release-plan/image-plan.json); do
            digest=$(jq -r --arg role "$role" '.images[$role].digest' release-plan/image-plan.json)
            tag=$(jq -r --arg role "$role" '.images[$role].tag' release-plan/image-plan.json)
            cp "previous-download/$role.json" "previous-assets/vulnerabilities/$role.json"
            cp "previous-download/$role.spdx.json" "previous-assets/sboms/$role.spdx.json"
            actual=$(docker buildx imagetools inspect "treeseed/$role:$tag" | awk '/^Digest:/{print $2;exit}')
            test "$actual" = "$digest" || { echo "Prior tag moved for $role" >&2; exit 1; }
            cosign verify --certificate-identity-regexp '^https://github.com/treeseed-ai/ai/.github/workflows/release.yml@refs/heads/main$' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' "treeseed/$role@$digest" >/dev/null
          done
          node --import tsx scripts/release/check-vulnerabilities.ts previous-assets/vulnerabilities
      - uses: actions/upload-artifact@v4
        with:
          name: image-reuse-plan
          path: |
            release-plan
            previous-assets
          if-no-files-found: error

  build-digests:
    needs: [validate, resolve-images]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(needs.resolve-images.outputs.matrix) }}"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - id: build
        if: matrix.action == 'built'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: "${{ matrix.dockerfile }}"
          build-args: "${{ matrix.buildArgs }}"
          platforms: linux/amd64
          outputs: "type=image,name=treeseed/${{ matrix.role }},push-by-digest=true,name-canonical=true,push=true"
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.treeseed-ai.role=${{ matrix.role }}
            org.treeseed-ai.build.identity=${{ matrix.buildIdentity }}
      - name: Record immutable digest
        run: |
          mkdir -p digest
          if test '${{ matrix.action }}' = built; then digest='${{ steps.build.outputs.digest }}'; else digest='${{ matrix.digest }}'; fi
          echo "$digest" > 'digest/${{ matrix.role }}.digest'
      - uses: actions/upload-artifact@v4
        with: { name: "digest-${{ matrix.role }}", path: digest, if-no-files-found: error }

  publish-tags:
    needs: [validate, build-digests]
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: digest-*, path: digests, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: image-reuse-plan }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@v3.9.2
      - uses: anchore/sbom-action/download-syft@v0.20.6
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Publish exact tags, scan, sign, and generate SBOMs
        run: |
          mkdir -p release-assets/sboms release-assets/vulnerabilities
          for file in digests/*.digest; do
            role=$(basename "$file" .digest)
            digest=$(cat "$file")
            action=$(jq -r --arg role "$role" '.images[$role].action' release-plan/image-plan.json)
            if test "$action" = built; then
              docker run --rm -v "$PWD/release-assets/vulnerabilities:/reports" -v "$PWD/.trivy-cache:/root/.cache/trivy" aquasec/trivy:0.74.0 image --scanners vuln --skip-version-check --exit-code 0 --severity CRITICAL --format json --output "/reports/$role.json" "treeseed/$role@$digest"
            else
              cp "previous-assets/vulnerabilities/$role.json" "release-assets/vulnerabilities/$role.json"
              cp "previous-assets/sboms/$role.spdx.json" "release-assets/sboms/$role.spdx.json"
            fi
          done
          node --import tsx scripts/release/check-vulnerabilities.ts release-assets/vulnerabilities
          for file in digests/*.digest; do
            role=$(basename "$file" .digest)
            digest=$(cat "$file")
            action=$(jq -r --arg role "$role" '.images[$role].action' release-plan/image-plan.json)
            if test "$action" = built; then
              docker buildx imagetools create -t "treeseed/$role:${{ inputs.version }}" "treeseed/$role@$digest"
              cosign sign --yes "treeseed/$role@$digest"
              syft "treeseed/$role@$digest" -o spdx-json="release-assets/sboms/$role.spdx.json"
            else
              cosign verify --certificate-identity-regexp '^https://github.com/treeseed-ai/ai/.github/workflows/release.yml@refs/heads/main$' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' "treeseed/$role@$digest" >/dev/null
            fi
          done
      - run: node --import tsx scripts/release/collect-image-manifest.ts digests release-assets/image-manifest.json release-plan/image-plan.json
      - run: cp release/manifest.json release-assets/compatibility-matrix.json && cp release/vulnerability-exceptions.json release-assets/vulnerability-exceptions.json
      - uses: actions/upload-artifact@v4
        with: { name: release-image-metadata, path: release-assets, if-no-files-found: error }

  packages:
    needs: [validate, publish-tags]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release-image-metadata, path: release-assets }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build policy-compliant Debian packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper lintian
          TREEAI_IMAGE_MANIFEST="$PWD/release-assets/image-manifest.json" dpkg-buildpackage -b -us -uc
          mkdir -p .artifacts
          find .. -maxdepth 1 -type f -name 'treeseed-ai*.deb' -exec cp {} .artifacts/ \;
          node --import tsx scripts/package-deb.ts configured config/platform.default.json
          lintian --fail-on error .artifacts/*.deb
      - name: Co-install package contract
        run: |
          root=$(mktemp -d)
          for deb in .artifacts/*.deb; do dpkg-deb --extract "$deb" "$root"; done
          test -x "$root/usr/bin/treeai"
          test -x "$root/usr/lib/treeseed-ai/runtime/bin/node"
          test -f "$root/usr/lib/systemd/system/treeseed-ai-manager-supervisor.service"
          test ! -e "$root/usr/bin/ai-factory-dev"
          test ! -e "$root/usr/bin/ai-factory-lab"
      - uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: .artifacts/*.deb
          if-no-files-found: error
          include-hidden-files: true

  github-release:
    needs: [validate, packages]
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: debian-packages, path: assets }
      - uses: actions/download-artifact@v4
        with: { name: release-image-metadata, path: assets }
      - name: Import release signing key
        env: { APT_GPG_PRIVATE_KEY: "${{ secrets.APT_GPG_PRIVATE_KEY }}" }
        run: printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Sign checksums and publish release
        env:
          GH_TOKEN: "${{ github.token }}"
          APT_GPG_PASSPHRASE: "${{ secrets.APT_GPG_PASSPHRASE }}"
        run: |
          export APT_RELEASE_FINGERPRINT="$(cat release/apt/RELEASE_KEY_FINGERPRINT)"
          node --import tsx scripts/release/stage-release-assets.ts assets published-assets
          cd published-assets
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS
          gpg --batch --yes --pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE" --local-user "$APT_RELEASE_FINGERPRINT" --detach-sign --armor SHA256SUMS
          cd ..
          gh release create "v${{ inputs.version }}" $(find published-assets -type f -print | sort) --target '${{ needs.validate.outputs.sha }}' --title "TreeSeed AI ${{ inputs.version }}" --notes-file docs/releases/0.6.0.md

  apt-repository:
    needs: github-release
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Download all released Debian packages
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p debs pages/apt
          gh release list --limit 100 --json tagName,isDraft,isPrerelease --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' | while read tag; do gh release download "$tag" --pattern '*.deb' --dir debs --skip-existing; done
      - name: Import signing key and build deterministic repository
        env:
          APT_GPG_PRIVATE_KEY: "${{ secrets.APT_GPG_PRIVATE_KEY }}"
          APT_GPG_PASSPHRASE: "${{ secrets.APT_GPG_PASSPHRASE }}"
        run: |
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          export APT_RELEASE_FINGERPRINT="$(cat release/apt/RELEASE_KEY_FINGERPRINT)"
          sh scripts/release/build-apt-repository.sh debs pages/apt '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with: { name: apt-pages-site, path: pages, if-no-files-found: error }

  apt-pages:
    needs: apt-repository
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apt-pages-site, path: pages }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages }
      - id: deploy
        uses: actions/deploy-pages@v4
