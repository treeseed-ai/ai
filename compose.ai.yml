services:
  vllm:
    image: ${TREESEED_VLLM_IMAGE:-vllm/vllm-openai:v0.25.0}
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HF_HOME: /models
    volumes:
      - ${TREESEED_AI_MODEL_CACHE:-.treeseed/ai/models}:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model
      - ${TREESEED_AI_MODEL:-Qwen/Qwen3.5-4B}
      - --served-model-name
      - ${TREESEED_AI_MODEL_ALIAS:-treeseed-qwen3.5-4b}
      - --max-model-len
      - ${TREESEED_AI_MAX_MODEL_LENGTH:-16384}
      - --max-num-seqs
      - ${TREESEED_AI_MAX_CONCURRENT_SEQUENCES:-1}
      - --gpu-memory-utilization
      - ${TREESEED_AI_GPU_MEMORY_UTILIZATION:-0.85}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --language-model-only
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
